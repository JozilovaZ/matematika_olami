version: '3.9'

services:
  web:
    build: .
    restart: always
    volumes:
      - db_data:/app/db.sqlite3
      - media_data:/app/media
      - static_data:/app/staticfiles
    env_file:
      - .env
    expose:
      - "8000"

  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "85:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      - web

volumes:
  db_data:
  media_data:
  static_data:
