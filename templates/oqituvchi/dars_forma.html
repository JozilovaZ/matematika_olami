{% extends 'base.html' %}

{% block title %}{{ sarlavha }}{% endblock %}

{% block content %}
<div class="detail-nav">
    <a href="{% url 'darslar' %}" class="detail-back-btn">
        <i class="fas fa-arrow-left"></i> Darslar
    </a>
</div>

<h1 class="section-title">{{ sarlavha }}</h1>

<div style="background: #fff; border-radius: 16px; padding: 32px;">
    <form method="post">
        {% csrf_token %}
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div>
                <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #333;">Raqam</label>
                <input type="text" name="raqam" value="{{ obj.raqam|default:'' }}" required
                    style="width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 14px; outline: none;">
            </div>
            <div>
                <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #333;">Nomi</label>
                <input type="text" name="nomi" value="{{ obj.nomi|default:'' }}" required
                    style="width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 14px; outline: none;">
            </div>
        </div>
        <div style="margin-bottom: 20px;">
            <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #333;">Tavsif</label>
            <textarea name="tavsif" rows="3" required
                style="width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 14px; outline: none; resize: vertical;">{{ obj.tavsif|default:'' }}</textarea>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div>
                <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #333;">Kategoriya</label>
                <select name="kategoriya"
                    style="width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 14px; outline: none; background: #fff;">
                    <option value="">-- Tanlang --</option>
                    {% for kat in kategoriyalar %}
                    <option value="{{ kat.pk }}" {% if obj.kategoriya_id == kat.pk %}selected{% endif %}>{{ kat.nomi }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #333;">Holat</label>
                <select name="holat"
                    style="width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 14px; outline: none; background: #fff;">
                    <option value="qulflangan" {% if obj.holat == 'qulflangan' %}selected{% endif %}>Qulflangan</option>
                    <option value="jarayonda" {% if obj.holat == 'jarayonda' %}selected{% endif %}>Jarayonda</option>
                    <option value="tugallangan" {% if obj.holat == 'tugallangan' %}selected{% endif %}>Tugallangan</option>
                </select>
            </div>
            <div>
                <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #333;">Davomiylik</label>
                <input type="text" name="davomiylik" value="{{ obj.davomiylik|default:'' }}" placeholder="30 daqiqa" required
                    style="width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 14px; outline: none;">
            </div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div>
                <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #333;">Icon</label>
                <input type="text" name="icon" value="{{ obj.icon|default:'' }}" required
                    style="width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 14px; outline: none;">
            </div>
            <div>
                <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #333;">Rang</label>
                <input type="color" name="rang" value="{{ obj.rang|default:'#e8f5e9' }}"
                    style="width: 100%; height: 46px; border: 2px solid #e0e0e0; border-radius: 12px; outline: none; cursor: pointer;">
            </div>
            <div>
                <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #333;">Tartib</label>
                <input type="number" name="tartib" value="{{ obj.tartib|default:'0' }}"
                    style="width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 14px; outline: none;">
            </div>
        </div>
        <div style="margin-bottom: 20px;">
            <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #333;">Dars mazmuni</label>
            <textarea name="mazmun" rows="8"
                style="width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 14px; outline: none; resize: vertical;">{{ obj.mazmun|default:'' }}</textarea>
        </div>
        <button type="submit" class="btn-primary" style="border: none; cursor: pointer;">
            <i class="fas fa-save"></i> Saqlash
        </button>
    </form>
</div>
{% endblock %}
