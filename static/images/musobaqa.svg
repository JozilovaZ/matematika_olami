<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Background -->
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1f3c;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="trophyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700" />
      <stop offset="100%" style="stop-color:#ff8c00" />
    </linearGradient>
    <linearGradient id="star1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe066" />
      <stop offset="100%" style="stop-color:#ffa500" />
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#bgGrad)" rx="16"/>

  <!-- Floating math symbols -->
  <text x="18" y="55" font-size="22" fill="#ffffff22" font-family="Arial" font-weight="bold">∑</text>
  <text x="340" y="40" font-size="18" fill="#ffffff1a" font-family="Arial" font-weight="bold">π</text>
  <text x="360" y="260" font-size="20" fill="#ffffff15" font-family="Arial" font-weight="bold">√</text>
  <text x="10" y="250" font-size="16" fill="#ffffff18" font-family="Arial" font-weight="bold">∞</text>
  <text x="170" y="22" font-size="14" fill="#ffffff15" font-family="Arial">x²+y²</text>
  <text x="290" y="285" font-size="13" fill="#ffffff15" font-family="Arial">f(x)</text>

  <!-- Stars scattered -->
  <polygon points="55,30 58,22 61,30 70,30 63,35 66,44 58,39 50,44 53,35 46,30" fill="#ffd70033"/>
  <polygon points="345,200 347,194 349,200 356,200 351,204 353,210 347,206 341,210 343,204 338,200" fill="#ffd70033"/>
  <polygon points="380,100 382,95 384,100 390,100 385,103 387,109 382,105 377,109 379,103 374,100" fill="#ffd70022"/>

  <!-- Trophy main body -->
  <g transform="translate(200, 145)">
    <!-- Cup body -->
    <path d="M-45,0 Q-50,-60 -30,-80 L30,-80 Q50,-60 45,0 Z" fill="url(#trophyGrad)" opacity="0.95"/>
    <!-- Cup shine -->
    <path d="M-30,-75 Q-40,-50 -38,-20" stroke="#fff8" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Cup stem -->
    <rect x="-8" y="0" width="16" height="30" fill="#ffa500" rx="2"/>
    <!-- Cup base -->
    <rect x="-30" y="30" width="60" height="12" fill="#ff8c00" rx="6"/>
    <!-- Trophy handles -->
    <path d="M-45,-40 Q-70,-40 -65,-15 Q-60,5 -45,-5" stroke="#ffd700" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M45,-40 Q70,-40 65,-15 Q60,5 45,-5" stroke="#ffd700" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Star on trophy -->
    <polygon points="0,-65 4,-55 15,-55 6,-48 10,-38 0,-45 -10,-38 -6,-48 -15,-55 -4,-55" fill="#fff" opacity="0.9"/>
  </g>

  <!-- Left person (student) -->
  <g transform="translate(85, 155)">
    <!-- Body -->
    <ellipse cx="0" cy="40" rx="20" ry="30" fill="#4a90d9"/>
    <!-- Head -->
    <circle cx="0" cy="-5" r="22" fill="#f5c5a3"/>
    <!-- Hair -->
    <path d="M-22,-10 Q-20,-30 0,-32 Q20,-30 22,-10" fill="#3d2b1f"/>
    <!-- Eyes -->
    <circle cx="-8" cy="-8" r="3" fill="#2d2d2d"/>
    <circle cx="8" cy="-8" r="3" fill="#2d2d2d"/>
    <!-- Smile -->
    <path d="M-8,2 Q0,10 8,2" stroke="#c0825a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Arms raised -->
    <line x1="-20" y1="20" x2="-45" y2="-5" stroke="#4a90d9" stroke-width="10" stroke-linecap="round"/>
    <line x1="20" y1="20" x2="38" y2="-5" stroke="#4a90d9" stroke-width="10" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="-8" y1="68" x2="-12" y2="100" stroke="#2d5a8e" stroke-width="10" stroke-linecap="round"/>
    <line x1="8" y1="68" x2="12" y2="100" stroke="#2d5a8e" stroke-width="10" stroke-linecap="round"/>
    <!-- Number badge -->
    <circle cx="0" cy="42" r="12" fill="#fff" opacity="0.9"/>
    <text x="0" y="47" font-size="13" fill="#4a90d9" font-weight="bold" text-anchor="middle">1</text>
  </g>

  <!-- Right person (student) -->
  <g transform="translate(315, 160)">
    <!-- Body -->
    <ellipse cx="0" cy="40" rx="20" ry="30" fill="#e85d9b"/>
    <!-- Head -->
    <circle cx="0" cy="-5" r="22" fill="#f5c5a3"/>
    <!-- Hair (longer) -->
    <path d="M-22,-10 Q-22,-35 0,-36 Q22,-35 22,-10 L20,5 Q0,15 -20,5 Z" fill="#5c3317"/>
    <!-- Eyes -->
    <circle cx="-8" cy="-8" r="3" fill="#2d2d2d"/>
    <circle cx="8" cy="-8" r="3" fill="#2d2d2d"/>
    <!-- Smile -->
    <path d="M-8,2 Q0,10 8,2" stroke="#c0825a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Arms raised -->
    <line x1="-20" y1="20" x2="-38" y2="-5" stroke="#e85d9b" stroke-width="10" stroke-linecap="round"/>
    <line x1="20" y1="20" x2="45" y2="-5" stroke="#e85d9b" stroke-width="10" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="-8" y1="68" x2="-12" y2="100" stroke="#9c2d65" stroke-width="10" stroke-linecap="round"/>
    <line x1="8" y1="68" x2="12" y2="100" stroke="#9c2d65" stroke-width="10" stroke-linecap="round"/>
    <!-- Number badge -->
    <circle cx="0" cy="42" r="12" fill="#fff" opacity="0.9"/>
    <text x="0" y="47" font-size="13" fill="#e85d9b" font-weight="bold" text-anchor="middle">2</text>
  </g>

  <!-- VS text in center -->
  <circle cx="200" cy="220" r="22" fill="#ff4444" opacity="0.85"/>
  <text x="200" y="227" font-size="16" fill="white" font-weight="bold" text-anchor="middle" font-family="Arial">VS</text>

  <!-- Sparkles / confetti -->
  <circle cx="130" cy="70" r="4" fill="#ffd700" opacity="0.8"/>
  <circle cx="270" cy="65" r="3" fill="#ff6b6b" opacity="0.8"/>
  <circle cx="150" cy="260" r="3" fill="#4ecdc4" opacity="0.8"/>
  <circle cx="250" cy="258" r="4" fill="#ffd700" opacity="0.8"/>
  <circle cx="50" cy="170" r="3" fill="#ff6b6b" opacity="0.6"/>
  <circle cx="350" cy="175" r="3" fill="#4ecdc4" opacity="0.6"/>

  <!-- Score display top -->
  <rect x="140" y="15" width="120" height="30" rx="15" fill="#ffffff15"/>
  <text x="200" y="35" font-size="13" fill="#ffd700" font-weight="bold" text-anchor="middle" font-family="Arial">🏆 Musobaqa</text>
</svg>
